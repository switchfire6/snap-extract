[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "snap-extract"
dynamic = ["version"]
description = "Export a local Marvel Snap card collection for AI deck building."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "switchfire6"}]
dependencies = []
keywords = ["marvel-snap", "csv", "collection", "deck-building", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Card Games",
]

[project.urls]
Repository = "https://github.com/switchfire6/snap-extract"
Issues = "https://github.com/switchfire6/snap-extract/issues"

[project.scripts]
snap-extract = "snap_extract.__main__:main"

[project.gui-scripts]
snap-extract-gui = "snap_extract.gui:main"

[tool.setuptools.packages.find]
include = ["snap_extract*"]

[tool.setuptools.dynamic]
version = {attr = "snap_extract.__version__"}

[tool.setuptools.package-data]
snap_extract = ["assets/*.ico"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
