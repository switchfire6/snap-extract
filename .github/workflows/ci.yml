name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . -r requirements-dev.txt
      - run: python -m ruff check snap_extract tests run_app.py tools
      - run: python -m unittest discover -s tests -v
      - name: Audit declared development and build dependencies
        if: matrix.python == '3.13'
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - name: Verify installed command
        working-directory: ${{ runner.temp }}
        run: snap-extract --help

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build Windows distribution
        run: ./build.ps1
      - name: Verify portable app, installation, upgrade and uninstall
        run: ./tools/Test-WindowsDistribution.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: snap-extract-windows
          path: |
            dist/Snap-Extract-*-Windows-x64.zip
            dist/Snap-Extract-*-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
